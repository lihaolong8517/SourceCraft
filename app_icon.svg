<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B21A8"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E0E7FF"/>
    </linearGradient>
  </defs>
  
  <!-- 圆角背景 -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bgGradient)"/>
  
  <!-- 混沌漩涡效果 -->
  <circle cx="128" cy="110" r="50" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="4"/>
  <circle cx="128" cy="110" r="35" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>
  <circle cx="128" cy="110" r="20" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  
  <!-- 下载箭头 -->
  <path d="M128 80 L128 160 M100 132 L128 160 L156 132" 
        stroke="url(#arrowGradient)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- 底部横线 -->
  <path d="M88 180 L168 180" stroke="url(#arrowGradient)" stroke-width="8" stroke-linecap="round"/>
</svg>
